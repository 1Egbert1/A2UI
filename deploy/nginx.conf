server {
    listen 80;
    listen [::]:80;
    server_name _;

    # playground 的 vite 产物
    root /var/www/a2ui;
    index index.html;

    # 上传图片走 base64 塞在 JSON 里，稍放宽一点
    client_max_body_size 20m;

    access_log /var/log/nginx/a2ui.access.log;
    error_log  /var/log/nginx/a2ui.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # ---- 前端 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源可以长缓存
    location ~* \.(js|css|woff2|png|jpg|svg)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- 后端 ----
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 用不到长连接复用，避免 nginx 主动换 keep-alive 干扰
        proxy_set_header Connection        '';

        # ★ 生成接口是 SSE，这三行缺一不可：
        #   buffering off —— 否则 nginx 会攒够 buffer 才下发，前端表现为“最后一次性出现”
        #   cache off     —— SSE 不能被缓存
        #   read_timeout  —— 模型思考模式下整轮可能 30s+，默认 60s 有时不够
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
