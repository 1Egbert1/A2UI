# A2UI 站点的 HTTPS 版 nginx 配置（由 deploy/setup-tls.sh 渲染后安装）
#
# 占位符（脚本里用 sed 替换）：
#   __SERVER_NAME__  已备案域名，或 _（只有 IP 时用 _ 兜住所有 Host）
#   __CANONICAL__    301 跳转的目标主机：有域名时填域名（IP 访问也并到域名上），
#                    只有 IP 时填 $host
#   __SSL_CERT__     fullchain.pem 的绝对路径
#   __SSL_KEY__      privkey.pem 的绝对路径
#
# 与 deploy/nginx.conf 的差别只有两处：
#   1. 80 只留 ACME 校验目录，其余全部 301 到 https（续期靠 webroot，所以这一条不能省）
#   2. 站点本体搬进 443 的 server 块，其余 location / SSE 参数一字未改

# ---------------- HTTP：只做 ACME 校验 + 跳转 ----------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_NAME__;

    root /var/www/a2ui;

    # Let's Encrypt 续期校验（webroot 模式）。这里必须 200，不能跳转，
    # 否则 7 天期的 IP 证书下一次续期就会失败。
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://__CANONICAL__$request_uri;
    }
}

# ---------------- HTTPS：真正的站点 ----------------
server {
    # nginx 1.24 用 listen 里的 http2 参数；1.25.1+ 换成了独立的 `http2 on;`，
    # 两者都能跑，前者在 1.25+ 上只会打一条 deprecated 警告。
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name __SERVER_NAME__;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # playground 的 vite 产物
    root /var/www/a2ui;
    index index.html;

    # 上传图片走 base64 塞在 JSON 里，稍放宽一点
    client_max_body_size 20m;

    access_log /var/log/nginx/a2ui.access.log;
    error_log  /var/log/nginx/a2ui.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # ---- 前端 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源可以长缓存
    location ~* \.(js|css|woff2|png|jpg|svg)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- 后端 ----
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 用不到长连接复用，避免 nginx 主动换 keep-alive 干扰
        proxy_set_header Connection        '';

        # ★ 生成接口是 SSE，这三行缺一不可：
        #   buffering off —— 否则 nginx 会攒够 buffer 才下发，前端表现为“最后一次性出现”
        #   cache off     —— SSE 不能被缓存
        #   read_timeout  —— 模型思考模式下整轮可能 30s+，默认 60s 有时不够
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
