# A2UI 的容器编排：web（nginx + 静态）+ server（Node）。
#
# 两条刻意为之的设计：
#   1. **宿主端口默认 8080 / 8443**，不占 80/443 —— 那两条留给后续服务或统一网关。
#      要改就改同目录 .env 里的 A2UI_HTTP_PORT / A2UI_HTTPS_PORT，不用动这个文件。
#   2. **server 不发布宿主端口**，只在 compose 内网里被 web 按服务名访问（http://server:3000），
#      Node 进程彻底不出网，少一个暴露面。
#
# 常用命令（在本目录执行）：
#   cp .env.example .env && vim .env     # 填 A2UI_SERVER_NAME 与模型 Key
#   docker compose up -d --build         # 构建并启动
#   docker compose logs -f web server    # 看日志
#   docker compose ps                    # 看状态与端口
#
# 证书：A2UI_CERT_DIR 指向宿主机上 fullchain.pem / privkey.pem 所在的目录（只读挂进容器）。
# 挂不到证书也能跑，web 的 entrypoint 会自动降级成 HTTP-only。

name: a2ui

services:
  server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: server
      args:
        # 国内机器换成 https://registry.npmmirror.com 能快一个数量级
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: a2ui-server:local
    container_name: a2ui-server
    environment:
      NODE_ENV: production
      PORT: "3000"
      # 下面几项都给空串当缺省 —— 服务端用 `||` 兜底，空串等价于「没配」
      AGENT_PROVIDER: ${AGENT_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-}
      CHAT_SYSTEM_PROMPT: ${CHAT_SYSTEM_PROMPT:-}
      HISTORY_LIMIT: ${HISTORY_LIMIT:-}
      SESSION_TTL_MS: ${SESSION_TTL_MS:-}
      MOCK_STREAM_DELAY_MS: ${MOCK_STREAM_DELAY_MS:-}
      SCENARIO_CHUNK_SIZE: ${SCENARIO_CHUNK_SIZE:-}
      AGENT_ICON_TOOLS: ${AGENT_ICON_TOOLS:-}
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - a2ui
    healthcheck:
      # 用 node 自带 fetch（Node 22），不额外装 curl/wget
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: a2ui-web:local
    container_name: a2ui-web
    depends_on:
      server:
        condition: service_healthy
    ports:
      # ★ 只绑回环：TLS 与 80/443 由 gateway 接管，web 不再对外暴露。
      #   写成 127.0.0.1:8080:80 而不是 8080:80 —— 少了前面那段就等于绑 0.0.0.0，
      #   又是「一个端口只能一个进程」的老问题。
      - "${A2UI_WEB_BIND:-127.0.0.1:8080}:80"
    environment:
      A2UI_SERVER_NAME: ${A2UI_SERVER_NAME:-_}
      # 故意留空：web 在网关后面，只跑纯 HTTP。填了证书名反而会抢 443 并和网关打架。
      A2UI_CERT_NAME: ""
    volumes:
      # 宿主 certbot 的 ACME 校验目录（只读挂进来，nginx 直接吐文件）。
      # 续期是 webroot 模式：certbot 写宿主 /var/www/a2ui-acme → 容器读同一份。
      - "${A2UI_ACME_DIR:-/var/www/a2ui-acme}:/var/www/acme:ro"
    restart: unless-stopped
    networks:
      - a2ui

  # ---- 入口网关：唯一占 80/443 的东西 ----
  # 以后加服务不用动这个文件里的 a2ui 部分，只要在 caddy/Caddyfile 里加一段反代：
  #   reverse_proxy host.docker.internal:8081     # 别的服务绑在宿主 127.0.0.1:8081
  gateway:
    image: caddy:2-alpine
    container_name: a2ui-gateway
    depends_on:
      - web
    ports:
      - "${A2UI_HTTP_PORT:-80}:80"
      - "${A2UI_HTTPS_PORT:-443}:443"
    environment:
      # Caddyfile 里用 {$A2UI_CERT_NAME} 取这个值
      A2UI_CERT_NAME: ${A2UI_CERT_NAME:-}
      # 域名站点用的证书目录名（备案通过后域名才可达，证书已就位）
      A2UI_DOMAIN_CERT_NAME: ${A2UI_DOMAIN_CERT_NAME:-}
      # 别让 Caddy 往容器外暴露 admin 接口（默认只监听容器内 127.0.0.1:2019）
      CADDY_ADMIN: 127.0.0.1:2019
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 证书整棵只读挂入（同 web 的理由：live/ 里是软链，只挂子目录会断）
      - "${A2UI_CERT_ROOT:-/etc/letsencrypt}:/etc/letsencrypt:ro"
      - caddy-data:/data
      - caddy-config:/config
    # 让网关能访问宿主 127.0.0.1 上的其它服务（给后续服务留的口子）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - a2ui

networks:
  a2ui:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
